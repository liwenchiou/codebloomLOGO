<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>Code Bloom Logo 選擇器</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-BKsgr_Pf.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BZdji6Oq.css">
</head>
<body>
  <div class="container my-4">
    <h1 class="text-center mb-4">Code Bloom Logo 選擇器</h1>
    <div class="row">
      <!-- 左邊：未確認 -->
      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-light">
            留下來的 Logo
          </div>
          <div class="card-body" id="logo-unconfirmed">
            <!-- TS 渲染未確認 Logo -->
          </div>
        </div>
      </div>

      <!-- 右邊：已確認 -->
      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-light">
            不要的 Logo
          </div>
          <div class="card-body" id="logo-confirmed">
            <!-- TS 渲染已確認 Logo -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS (含 Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Vite 專案入口 -->
</body>
</html>
